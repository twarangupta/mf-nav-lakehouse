[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mf-nav-lakehouse"
version = "0.1.0"
description = "Daily AMFI mutual fund NAV pipeline: Airflow, S3, Databricks, Delta Lake (Medallion), PySpark analytics."
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.32",
]

[project.optional-dependencies]
# Laptop and CI tools. Kept small on purpose: pyspark (and Java in CI)
# are added only when the first PySpark unit test needs them.
dev = [
    "pytest>=8",
    # Pinned to one minor version so the laptop and CI format code identically.
    "ruff>=0.17,<0.18",
]

[tool.setuptools.packages.find]
# Only src/ is an installable package; dags/, tests/, docs/, infra/ are not.
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Code snippets inside the Markdown docs are teaching examples, aligned by hand.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
