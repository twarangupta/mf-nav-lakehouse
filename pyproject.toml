[project]
name = "mf-nav-lakehouse"
version = "0.1.0"
description = "Daily AMFI mutual fund NAV pipeline: Airflow, S3, Databricks, Delta Lake (Medallion), PySpark analytics."
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pyspark>=3.5,<4.1",
    "delta-spark>=3.2",
    "pytest>=8",
    "chispa>=0.10",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
